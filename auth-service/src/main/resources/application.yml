server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yml
    enabled: true

auth:
  jwt:
    private-key-path: classpath:keys/private_key.pem
    access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

security:
  jwt:
    public-key-path: classpath:keys/public_key.pem
    issuer: auth-service

service:
  api-key: ${SERVICE_API_KEY:default-service-secret-key}

app:
  cleanup:
    refresh-token-cron: "${REFRESH_TOKEN_CRON:0 0 * * * *}"
