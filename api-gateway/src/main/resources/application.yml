server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8080}
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: ${USER_SERVICE_URL:http://user-service:8080}
              predicates:
                - Path=/api/v1/users/**

            - id: meal-service
              uri: ${MEAL_SERVICE_URL:http://meal-service:8080}
              predicates:
                - Path=/api/v1/dishes/**

            - id: meal-plan-service
              uri: ${MEAL_PLAN_SERVICE_URL:http://meal-plan-service:8080}
              predicates:
                - Path=/api/v1/meal-plans/**

            - id: meal-plan-orchestrator
              uri: ${MEAL_PLAN_ORCHESTRATOR_URL:http://meal-plan-orchestrator:8080}
              predicates:
                - Path=/api/v1/orchestrator/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    fedod.gateway: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
